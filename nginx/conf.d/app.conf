# nginx/conf.d/app.conf
# =============================================================================
# Virtual host for the Speech Translation Backend
#
# Handles:
#   - HTTP → HTTPS redirect (port 80)
#   - HTTPS termination with Let's Encrypt certificates (port 443)
#   - Standard REST API proxying to FastAPI (uvicorn:8000)
#   - WebSocket upgrade proxying for /ws/* endpoints
#   - ACME challenge path for Certbot renewal
#
# Replace YOUR_DOMAIN with your actual domain (e.g. api.capstron.example.com)
# =============================================================================

# ------------------------------------------------------------------
# Upstream — FastAPI backend container
# Docker's internal DNS resolves "speech_web" to the web container IP
# ------------------------------------------------------------------
upstream fastapi_backend {
    server speech_web:8000;
    keepalive 32;          # reuse connections to the upstream
}

# ------------------------------------------------------------------
# HTTP — redirect all traffic to HTTPS except ACME challenge
# ------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt ACME challenge (certbot uses this path for renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------
# HTTPS — main virtual host
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2  on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ---------------------------------------------------------------
    # SSL — Let's Encrypt certificates (managed by Certbot)
    # ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Modern SSL settings (Mozilla Intermediate profile)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # HSTS (force HTTPS for 6 months; browsers cache this)
    add_header Strict-Transport-Security "max-age=15768000" always;

    # ---------------------------------------------------------------
    # General proxy settings (shared by REST and WebSocket locations)
    # ---------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Increase timeouts — AI inference takes several seconds
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ---------------------------------------------------------------
    # WebSocket endpoint — REQUIRES special upgrade headers
    #
    # Without these, Nginx drops the Connection header and the
    # client falls back to HTTP, breaking the WebSocket handshake.
    # ---------------------------------------------------------------
    location /ws/ {
        proxy_pass         http://fastapi_backend;

        # WebSocket upgrade — these two headers are MANDATORY
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Long timeouts — WebSocket sessions stay open for entire
        # translation session (potentially minutes)
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Disable buffering — stream audio frames immediately
        proxy_buffering    off;
    }

    # ---------------------------------------------------------------
    # REST API — standard HTTP proxying
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://fastapi_backend;

        # Needed for HTTP/1.1 keepalive on the upstream
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # Large body for audio uploads
        client_max_body_size 64M;
    }

    # ---------------------------------------------------------------
    # Health check — no auth, lightweight
    # ---------------------------------------------------------------
    location /health {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log off;
    }

    # ---------------------------------------------------------------
    # OpenAPI docs (Swagger UI)
    # ---------------------------------------------------------------
    location /docs {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /openapi.json {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
