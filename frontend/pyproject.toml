[tool.poetry]
name = "capstron-frontend"
version = "0.1.0"
description = "Streamlit demo frontend for the CapsTron Speech Translation system"
authors = ["Wraith <wraithyadav@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
